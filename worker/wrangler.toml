name = "stok-sabun-palem"
main = "src/index.ts"
compatibility_date = "2025-11-01"

# Domain custom untuk API: api.ices.my.id (bukan workers.dev).
# Alasan: ISP XL memblokir *.workers.dev di level DNS (19 Nov 2026,
# resolve ke blockpage.xlaxiata.id), sehingga aplikasi tidak bisa
# mencapai API dari HP staff. Domain ini tinggal di zona ices.my.id
# (akun Cloudflare Zaky); saat migrasi ke akun perusahaan, daftarkan
# ulang domain ini (atau domain perusahaan) ke Worker yang baru,
# lihat docs/migrasi-akun.md. URL workers.dev tetap aktif sebagai
# alamat langsung Worker, tapi aplikasi memakai domain ini.
routes = [{ pattern = "api.ices.my.id", custom_domain = true }]

# ID sheet TIDAK sensitif (hanya pengenal), jadi disimpan sebagai var
# biasa di sini. Yang rahasia (email + private key service account)
# TIDAK BOLEH masuk file ini; keduanya disimpan sebagai Worker secrets:
#   wrangler secret put SHEETS_CLIENT_EMAIL
#   wrangler secret put SHEETS_PRIVATE_KEY
# Lihat scripts/setup-secrets.sh dan docs/migrasi-akun.md.
[vars]
SHEET_ID = "1SRXE0Ma1VXO_W1DJJ1GISM0Tmcnbr9w8eGyBrQj2IhA"
ALLOWED_ORIGINS = "https://zakyshadra.github.io,https://caturwangsa.ices.my.id,https://caturwangsa.pages.dev,http://localhost:5173"
# Folder Drive tujuan arsip foto absen ("Arsip Foto Absensi Sabun
# Palem"). ID folder TIDAK sensitif (hanya pengenal), seperti
# SHEET_ID. Saat migrasi ke akun perusahaan, ganti dengan ID folder
# baru di Drive perusahaan (lihat docs/migrasi-akun.md).
ARCHIVE_DRIVE_FOLDER_ID = "1tIFFDXOKMLoHBNkDz_Mcw7m-JW1VreUx"

# Cron harian jam 01:00 WIB (18:00 UTC hari sebelumnya):
# arsipkan foto absen lebih tua dari 2 bulan ke Google Drive (lihat
# worker/src/archive.ts). Tiap tanggal 1, buat juga tab bulanan baru
# di Sheet untuk bulan yang baru dimulai; kalau tab bulan itu sudah
# ada, tidak dibuat lagi.
[triggers]
crons = ["0 18 * * *"]

# Database absensi (D1): catatan absen + verifikasi selfie + bukti
# kerja + foto (base64, sementara; lihat worker/schema.sql).
# Dibuat: wrangler d1 create sabun-palem-absen
# Skema: wrangler d1 execute sabun-palem-absen --remote --file=schema.sql
[[d1_databases]]
binding = "sabun_palem_absen"
database_name = "sabun-palem-absen"
database_id = "06dd5164-3722-47df-875f-807394e42aed"
