<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mengarahkan...</title>
    <script>
      // Single Page Apps for GitHub Pages (rafrex/spa-github-pages).
      // GitHub Pages tidak punya fallback server untuk rute SPA, jadi
      // refresh di halaman dalam (misal /stok-caturwangsa/absensi)
      // mengembalikan 404. File ini menangkap rute tersebut dan
      // mengarahkan kembali ke index dengan rute disimpan di query,
      // lalu script di index.html mengembalikan rutenya.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
